name: Push to main branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get lowercase repository details
        id: lowercase-repo-details
        shell: pwsh
        run: |
          "::set-output name=repo::$($env:GITHUB_REPOSITORY.ToLowerInvariant())"

      - name: Build and deploy image
        run: |
          docker build -t ghcr.io/${{ steps.lowercase-repo-details.outputs.repo }}:latest .
          docker push ghcr.io/${{ steps.lowercase-repo-details.outputs.repo }}:latest

  test:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run tests
        run: |
          echo "Running tests..."

  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Deploy to production
        run: |
            if [ "${{vars.AUTODEPLOY_ACTIVATED}}" != "true" ]; then
                echo "Cancelled deployment because ${{vars.AUTODEPLOY_ACTIVATED}} is not set or not true"
                exit 0
            fi
            
            echo "Calling ${{vars.AUTODEPLOY_BASE_URL}}/deploy"
            RESPONSE=$(curl -s -w "\\n%{http_code}" -u ${{secrets.AUTODEPLOY_AUTH_USERNAME}}:${{secrets.AUTODEPLOY_AUTH_PASSWORD}} ${{vars.AUTODEPLOY_BASE_URL}}/deploy)
            HTTP_CODE=$(echo "${RESPONSE}" | tail -n 1)
            HTTP_BODY=$(echo "${RESPONSE}" | head -n -1)
            echo "${HTTP_BODY}"
            
            if [ "$HTTP_CODE" != "200" ]; then
                echo "${HTTP_CODE}"
                exit 1
            fi
